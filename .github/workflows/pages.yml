name: Publish simulator
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node verify-speed-profile.cjs
      - run: node verify-nav-thrust.cjs
      - run: node verify-autoland.cjs
      - run: node verify-arrival-tow.cjs
      - run: node verify-heavy-cargo.cjs
      - run: node verify-fighter-controls.cjs
      - run: node verify-roll-replay.cjs
      - run: node verify-tactical-lock.cjs
      - run: node verify-island-fields.cjs
      - run: node verify-taipei-city.cjs
      - run: node verify-helicopter.cjs
      - run: node verify-multiplayer.cjs
      - run: node verify-tactical.cjs
      - run: node verify-multiplayer-combat.cjs
      - run: node verify-carrier-ops.cjs
      - run: node verify-weather-windshear.cjs
      - run: node verify-fdr-analysis.cjs
      - run: node verify-air-refueling.cjs
      - run: node verify-advanced-physics.cjs
      - run: node verify-airways-nav.cjs
      - run: node verify-visual-fx.cjs
      - run: node verify-custom-rooms.cjs
      - run: node verify-aircraft-skins.cjs
      - run: node verify-cockpit-enhancements.cjs
      - run: node verify-combat-leaderboard.cjs
      - run: node verify-windshield-physics.cjs
      - run: node verify-airport-infrastructure.cjs
      - run: node verify-cockpit-interactive.cjs
      - run: node verify-supermaneuver-gforce.cjs
      - run: node verify-mobile-viewport.cjs
      - run: node verify-maps-navigation.cjs
      - run: node verify-multiplayer-interaction.cjs
      - run: node verify-combat-formation.cjs
      - run: node verify-liveries-themes.cjs
      - run: node verify-layout-and-3dmap.cjs
      - run: node verify-sky-raytracing.cjs
      - run: node verify-v60-features.cjs
      - run: node verify-v61-performance.cjs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
